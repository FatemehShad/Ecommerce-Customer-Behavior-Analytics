name: Analytics quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_IVY_DIR: /tmp/ecommerce-spark-ivy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: python -m pip install -e '.[dev,notebooks]'
      - name: Fetch and verify Delta JVM artifacts
        run: |
          jars=$(python scripts/fetch_delta_jars.py --directory /tmp/ecommerce-delta-jars)
          echo "SPARK_DELTA_JARS=$jars" >> "$GITHUB_ENV"
      - name: Lint
        run: ruff check .
      - name: Transformation contracts and Delta integration tests
        run: pytest -q --junitxml=artifacts/pytest.xml
      - name: Execute notebook against a small synthetic lakehouse
        run: |
          ecommerce-analytics generate --output data/notebook-smoke.csv --rows 1000
          ecommerce-analytics run --input data/notebook-smoke.csv --output output/notebook-smoke
          python -m ipykernel install --prefix "$RUNNER_TEMP/jupyter" --name ecommerce-analytics
          JUPYTER_PATH="$RUNNER_TEMP/jupyter/share/jupyter" python scripts/execute_kpi_notebook.py --source synthetic --lakehouse output/notebook-smoke
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: product-kpi-notebook
          path: artifacts/product_kpis.executed.ipynb
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: artifacts/pytest.xml
          if-no-files-found: ignore
